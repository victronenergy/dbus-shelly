name: Makefile CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev libglib2.0-dev dbus dbus-x11
        python -m pip install --upgrade pip
        pip install dbus-python dbus_fast aioshelly websockets zeroconf async_timeout s2_python==0.8.1

    - name: Run install test
      run: make testinstall

    - name: Install test dependencies
      run: pip install -r tests/requirements.txt

    - name: Run end-to-end tests
      run: make test

    - name: Upload test logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs
        path: /tmp/pytest-of-*/
